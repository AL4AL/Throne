name: AL4AL CI (push)
on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Engine/UI boundary
        run: cmake -DROOT=${{ github.workspace }} -P cmake/EngineBoundary.cmake
      - name: P0 cert-pin alias smoke
        run: bash script/ci/p0_xhttp_pin_check.sh
      - name: P1 subscription NUL-safety
        run: bash script/ci/p1_sub_nul_check.sh
